name: Polititrace Nigeria Daily Dispatch

on:
  push:
    branches: [ main ]
  schedule:
    # Runs daily morning at 06:00 WAT (05:00 UTC)
    - cron: '0 5 * * *'
    # Evening wrap-up at 17:00 WAT (16:00 UTC)
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  dispatch-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Nigeria Politics & Society Dispatcher
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python nigeria_tracker.py

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_nigeria_news.json latest_nigeria_briefing.md email_body.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily Nigeria briefing and history [skip ci]"
            git push
          fi
