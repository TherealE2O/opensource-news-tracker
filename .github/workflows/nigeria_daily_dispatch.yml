name: Polititrace Nigeria Daily Dispatch

on:
  push:
    branches: [ main ]
  schedule:
    # 04:30 WAT (03:30 UTC) - Dawn breaking news & overnight developments
    - cron: '30 3 * * *'
    # 06:00 WAT (05:00 UTC) - Morning drive & morning talk radio kickoff
    - cron: '0 5 * * *'
    # 12:00 WAT (11:00 UTC) - Midday pulse & market/business updates
    - cron: '0 11 * * *'
    # 16:30 WAT (15:30 UTC) - Afternoon rush & developing national stories
    - cron: '30 15 * * *'
    # 18:00 WAT (17:00 UTC) - Prime evening wrap-up & day summary
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  dispatch-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4

      - name: Run Nigeria Politics & Society Dispatcher
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python nigeria_tracker.py

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_nigeria_news.json latest_nigeria_briefing.md email_body.html staff_dispatch.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily Nigeria briefing and history [skip ci]"
            git push
          fi
